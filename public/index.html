<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Shotful — full-page screenshots of any website</title>
<meta name="description" content="Paste any URL and get the whole page back as one screenshot. Free, no sign-up, no extension. Also available as a simple HTTP API." />
<meta name="keywords" content="screenshot, full page screenshot, website screenshot, screenshot api, capture website, long screenshot, web page capture" />
<meta name="author" content="Shotful" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="#000000" />
<link rel="canonical" href="https://shotful.pages.dev/" />

<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Shotful" />
<meta property="og:title" content="Shotful — full-page screenshots of any website" />
<meta property="og:description" content="Paste any URL and get the whole page back as one screenshot. Free, no sign-up. Also available as an API." />
<meta property="og:url" content="https://shotful.pages.dev/" />
<meta property="og:image" content="https://shotful.pages.dev/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Shotful — screenshot any website, full page, in one call." />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shotful — full-page screenshots of any website" />
<meta name="twitter:description" content="Paste any URL and get the whole page back as one screenshot. Free, no sign-up. Also available as an API." />
<meta name="twitter:image" content="https://shotful.pages.dev/og.png" />

<link rel="stylesheet" href="/style.css" />
<script src="/script.js" defer></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Shotful",
  "url": "https://shotful.pages.dev/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "description": "Paste any URL and get the whole page back as a single screenshot.",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
</head>
<body>

<div class="hero">
  <header class="brand">
    <img src="/icon.svg" alt="" width="22" height="22" />
    <span class="mark">Shotful</span>
  </header>

  <main class="core">
    <h1>Screenshot any&nbsp;website.</h1>
    <p class="sub">Full page, in one call. No sign-up.</p>

    <form id="form" autocomplete="off">
      <input id="url" type="url" placeholder="https://example.com" spellcheck="false" aria-label="Website URL" />
      <button id="go" type="submit">Capture</button>
    </form>

    <label class="opt"><input id="full" type="checkbox" checked /> Full page</label>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <noscript><p class="status">This tool needs JavaScript. The API works without it: <code>/api/screenshot?url=…</code></p></noscript>
  </main>

  <footer class="foot">
    <span id="endpoint">/api/screenshot?url=…</span>
    <a href="https://github.com/rajforsuree/shotful" target="_blank" rel="noopener">Source</a>
  </footer>
</div>

<section class="result" id="result" hidden aria-label="Screenshot result"></section>

</body>
</html>
