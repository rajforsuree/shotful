name = "shotapi"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare's managed headless browser (Browser Rendering).
# Free plan: 10 browser-minutes/day. Paid ($5/mo): 10 browser-hours/month.
[browser]
binding = "BROWSER"

# The public site. Files here are served at the edge; /api/* hits the Worker.
[assets]
directory = "../web"
binding = "ASSETS"
